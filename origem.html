  <!-- Formulário -->
<section id="contato" style="padding: 60px 20px; background: #701474; color: #FFFFFF;">
  <h2 style="text-align:center; font-size: 32px; margin-bottom: 20px;">
    Fale com a gente
  </h2>

  <form id="leadForm"
        style="max-width: 500px; margin: auto; display: flex; flex-direction: column; gap: 15px;">
    
    <input type="hidden" name="_subject" value="Novo lead - Kyber IA">
    
    <input type="text" name="nome" placeholder="Nome" required 
      style="padding:12px; border-radius:8px; border:1px solid #E2E8F0; background:#F8FAFC;">
    
    <input type="text" name="sobrenome" placeholder="Sobrenome" required 
      style="padding:12px; border-radius:8px; border:1px solid #E2E8F0; background:#F8FAFC;">
    
    <input type="text" name="empresa" placeholder="Empresa" required 
      style="padding:12px; border-radius:8px; border:1px solid #E2E8F0; background:#F8FAFC;">
    
    <input type="email" name="email" placeholder="E-mail" required
      style="padding:12px; border-radius:8px; border:1px solid #E2E8F0; background:#F8FAFC;">

    <input type="text" name="telefone" placeholder="Telefone" 
      style="padding:12px; border-radius:8px; border:1px solid #E2E8F0; background:#F8FAFC;">

    <textarea name="mensagem" placeholder="Como podemos te ajudar?" required
      style="padding:12px; border-radius:8px; border:1px solid #E2E8F0; background:#F8FAFC;"></textarea>

    <button id="submitBtn" type="submit" style="
      padding: 14px;
      background: #F8FAFC;
      color: #701474;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    ">
      Enviar mensagem
    </button>

    <p id="formMsg" style="text-align:center; margin-top:10px; font-weight:500;"></p>
    
  </form>
</section>
